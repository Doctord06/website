<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DrCelestial</title>

  <meta
    name="description"
    content="Official links for DrCelestial — YouTube, Twitch, and Discord."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="space-background">
    <div class="stars stars-1"></div>
    <div class="stars stars-2"></div>
    <div class="cyan-glow glow-left"></div>
    <div class="cyan-glow glow-right"></div>
  </div>

  <main class="page">

    <section class="profile">

      <div class="logo">
        ☾
      </div>

      <p class="eyebrow">DRCELESTIAL</p>

      <h1>WELCOME</h1>

      <p class="subtitle">
        CONNECT WITH ME
      </p>

      <div class="divider"></div>

    </section>


    <section class="links">

      <a
        class="social-card youtube"
        href="https://youtube.com/"
        target="_blank"
        rel="noreferrer"
      >
        <div class="social-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12Z"
            />
          </svg>
        </div>

        <div class="social-info">
          <h2>YouTube</h2>
          <p>Subscribe & watch</p>
        </div>

        <div class="arrow">→</div>
      </a>


      <a
        class="social-card twitch"
        href="https://twitch.tv/TheDrCelestial"
        target="_blank"
        rel="noreferrer"
      >
        <div class="social-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M4 2 1 5v15h5v3l3-3h4l6-6V2H4Zm13 11-3 3h-5l-3 3v-3H3V4h14v9Zm-2-7h-2v6h2V6Zm-5 0H8v6h2V6Z"
            />
          </svg>
        </div>

        <div class="social-info">
          <h2>Twitch</h2>
          <p>Follow & watch live</p>
        </div>

        <div class="arrow">→</div>
      </a>


      <a
        class="social-card discord disabled"
        href="#"
        id="discordLink"
        aria-disabled="true"
      >
        <div class="social-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M20.3 4.4A16 16 0 0 0 16.3 3l-.5 1a14 14 0 0 0-7.6 0l-.5-1a16 16 0 0 0-4 1.4C1.2 8.1.5 11.7.8 15.2A16 16 0 0 0 5.7 18l1.2-1.6a10 10 0 0 1-1.8-.9l.4-.3c3.5 1.6 7.4 1.6 10.9 0l.5.3a12 12 0 0 1-1.9.9l1.2 1.6a16 16 0 0 0 4.9-2.8c.4-4.1-.7-7.7-2.8-10.8ZM8.3 13.5c-1 0-1.9-.9-1.9-2s.8-2 1.9-2c1 0 1.9.9 1.9 2s-.9 2-1.9 2Zm7.4 0c-1 0-1.9-.9-1.9-2s.8-2 1.9-2 1.9.9 1.9 2-.9 2-1.9 2Z"
            />
          </svg>
        </div>

        <div class="social-info">
          <h2>Discord</h2>
          <p>Coming soon</p>
        </div>

        <div class="arrow">→</div>
      </a>

    </section>


    <footer>
      <div class="footer-line"></div>

      <span class="footer-moon">☾</span>

      <div class="footer-line"></div>

      <p>© <span id="year"></span> DrCelestial</p>
    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
